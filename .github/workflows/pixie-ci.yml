# Pixie's benchmark fork of Apache Fineract (Pixie ADR-0148).
#
# Upstream's 27 workflows are removed here: its core job alone runs up to an
# hour, and this fork exists to measure changes an agent makes. This one job
# is the check Pixie's merge gate reads: it compiles the modules a pull
# request changes and runs their unit tests, as upstream's build does for
# every module. The Java toolchain, Gradle setup and TZ are upstream's.
name: pixie-ci

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixie-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: The modules this change touches
        id: modules
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          modules=$(git diff --name-only "$BASE"...HEAD | cut -d/ -f1 | sort -u \
            | while read -r dir; do
                if [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then echo ":$dir"; fi
              done | tr '\n' ' ')
          echo "Changed modules: ${modules:-none}"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

      - name: Compile and unit-test them
        if: steps.modules.outputs.modules != ''
        run: |
          tasks=""
          for module in ${{ steps.modules.outputs.modules }}; do tasks="$tasks $module:test"; done
          ./gradlew --no-daemon $tasks

      - name: Nothing to build
        if: steps.modules.outputs.modules == ''
        run: echo "No Gradle module changed."
